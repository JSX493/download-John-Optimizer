<script>
    // Dispara o download de forma automática assim que a página abre
    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            const link = document.getElementById('auto-download');
            if (link) {
                link.click(); // Simula o clique do usuário
            }
        }, 300); // Aguarda 300 milissegundos por segurança
    </script>
